<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DTable</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
            <rect x="2" y="2.5" width="14" height="13" rx="2.5" stroke="currentColor" stroke-width="1.6" />
            <path d="M2 6.75H16" stroke="currentColor" stroke-width="1.6" />
            <path d="M2 11.25H16" stroke="currentColor" stroke-width="1.4" />
            <path d="M8.5 6.75V15.5" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </div>
        <span class="brand-title">DTable</span>
      </div>

      <span id="statusPill" class="status-pill" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Scanning...</span>
      </span>
    </header>

    <section class="section">
      <div class="section-label">Export Format</div>
      <div class="segmented-control" role="radiogroup" aria-label="Export format">
        <button
          type="button"
          id="formatXlsxBtn"
          class="segment-btn is-active"
          role="radio"
          aria-checked="true"
          data-format="xlsx"
        >
          <span>Excel (.xlsx)</span>
        </button>
        <button
          type="button"
          id="formatCsvBtn"
          class="segment-btn"
          role="radio"
          aria-checked="false"
          data-format="csv"
        >
          <span>CSV (.csv)</span>
        </button>
      </div>
    </section>

    <section class="actions">
      <button type="button" id="exportAllBtn" class="btn btn-primary" disabled>
        <span class="btn-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2.25V10.5" />
            <path d="M4.75 7.5L8 10.75L11.25 7.5" />
            <path d="M2.75 11.75V12.5C2.75 13.05 3.2 13.5 3.75 13.5H12.25C12.8 13.5 13.25 13.05 13.25 12.5V11.75" />
          </svg>
        </span>
        <span class="btn-spinner" aria-hidden="true"></span>
        <span id="exportAllLabel">Export All Tables</span>
      </button>

      <button type="button" id="selectTableBtn" class="btn btn-secondary">
        <span class="btn-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="4.5" />
            <path d="M8 1.5V3.5" />
            <path d="M8 12.5V14.5" />
            <path d="M1.5 8H3.5" />
            <path d="M12.5 8H14.5" />
          </svg>
        </span>
        <span>Select Table on Page</span>
      </button>
    </section>

    <section class="tables-section">
      <div class="tables-header">
        <span class="section-label">Detected Tables</span>
        <span id="tablesHint" class="tables-hint">Hover to locate</span>
      </div>

      <div id="tablesList" class="tables-list" role="list"></div>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2.5" />
            <path d="M3 9.5H21" />
            <path d="M9.5 9.5V20" />
          </svg>
        </div>
        <div id="emptyTitle" class="empty-title">No tables found</div>
        <div id="emptyDesc" class="empty-desc">
          This page does not contain any visible data tables.
        </div>
      </div>
    </section>

    <div id="feedbackBanner" class="feedback-banner" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
